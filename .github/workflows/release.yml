name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test tests/WorkspaceOS.Tests/WorkspaceOS.Tests.csproj -c Release --nologo -v minimal

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/WorkspaceOS/WorkspaceOS.csproj
          "version=$($csproj.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT

      - name: Download AutoHotkey v2 runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/AutoHotkey | Out-Null
          $urls = @(
            "https://www.autohotkey.com/download/2.0/AutoHotkey_2.0.27.zip",
            "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.27/AutoHotkey_2.0.27.zip"
          )
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile "$env:TEMP\ahk.zip" -ErrorAction Stop; break }
            catch { Write-Warning "download failed: $u" }
          }
          if (-not (Test-Path "$env:TEMP\ahk.zip")) { throw "AutoHotkey runtime download failed" }
          Expand-Archive "$env:TEMP\ahk.zip" "$env:TEMP\ahk" -Force
          Copy-Item "$env:TEMP\ahk\AutoHotkey64.exe" publish/AutoHotkey/AutoHotkey64.exe -Force

      - name: Publish app
        run: >
          dotnet publish src/WorkspaceOS/WorkspaceOS.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish --nologo

      - name: Build installer (in-box csc, dual payload)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw "in-box csc not found" }
          # A response file bypasses shell quoting/continuation quirks: csc reads
          # its arguments from disk, one per line. One Add-Content per argument —
          # nothing for pwsh or YAML to mangle.
          $ws  = $env:GITHUB_WORKSPACE
          $rsp = "$ws\installer\installer.rsp"
          Set-Content -Path $rsp -Value '/nologo' -Encoding utf8
          Add-Content $rsp '/target:winexe'
          Add-Content $rsp '/optimize+'
          Add-Content $rsp "/out:$ws\publish\WorkspaceOS-Setup.exe"
          Add-Content $rsp "/resource:$ws\publish\WorkspaceOS.exe,WorkspaceOS.exe"
          Add-Content $rsp "/resource:$ws\publish\AutoHotkey\AutoHotkey64.exe,AutoHotkey64.exe"
          Add-Content $rsp '/reference:System.Windows.Forms.dll'
          Add-Content $rsp '/reference:System.dll'
          Add-Content $rsp "$ws\installer\Setup.cs"
          Write-Host "--- csc response file ---"
          Get-Content $rsp
          & $csc "@$rsp"
          if ($LASTEXITCODE -ne 0) { throw "installer compilation failed" }
          if (-not (Test-Path "$ws\publish\WorkspaceOS-Setup.exe")) { throw "installer output missing" }

      - name: Build portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $dir = "$env:TEMP\wos-portable"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$dir/AutoHotkey" | Out-Null
          Copy-Item publish/WorkspaceOS.exe "$dir/" -Force
          Copy-Item publish/AutoHotkey/AutoHotkey64.exe "$dir/AutoHotkey/" -Force
          Copy-Item README.md "$dir/README.txt" -Force
          Compress-Archive -Path "$dir/*" -DestinationPath "publish/WorkspaceOS-$env:VERSION-portable.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            publish/WorkspaceOS.exe
            publish/WorkspaceOS-Setup.exe
            publish/WorkspaceOS-*-portable.zip
            publish/AutoHotkey/AutoHotkey64.exe

  build-deb:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          V=$(grep -oPm1 '(?<=<Version>)[^<]+' src/WorkspaceOS.Linux/WorkspaceOS.Linux.csproj)
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests (layout core + Linux keymap)
        run: dotnet test tests/WorkspaceOS.Tests/WorkspaceOS.Tests.csproj -c Release --nologo -v minimal

      - name: Publish native Linux daemon (self-contained)
        run: >
          dotnet publish src/WorkspaceOS.Linux/WorkspaceOS.Linux.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish-linux --nologo

      - name: Install X11 tools for verification
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          xvfb wmctrl xdotool x11-utils x11-xserver-utils gsettings-desktop-schemas dconf-cli

      - name: Verify daemon against a real X server (Xvfb)
        run: |
          set -e
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            set -e
            export XDG_CURRENT_DESKTOP=other

            # A window manager so EWMH answers; openbox if present, else best effort.
            if command -v openbox >/dev/null 2>&1; then
              openbox &
              sleep 1
            fi

            # Daemon smoke test: starts, applies the keymap (xbindkeys fallback on
            # bare Xvfb), binds the IPC socket, and stays alive.
            publish-linux/workspaceos daemon &
            DAEMON_PID=$!
            trap "kill $DAEMON_PID 2>/dev/null || true" EXIT
            sleep 4
            kill -0 $DAEMON_PID

            publish-linux/workspaceos status
            publish-linux/workspaceos retile
            publish-linux/workspaceos keys >/dev/null
          '
          echo "Xvfb verification passed"

      - name: Assemble .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/lib/workspaceos \
                   deb/usr/share/doc/workspaceos deb/usr/share/applications \
                   deb/usr/lib/systemd/user deb/etc/xdg/autostart

          cp packaging/deb/control deb/DEBIAN/control
          sed -i "s/^Version: .*/Version: $VERSION/" deb/DEBIAN/control

          install -m 755 packaging/deb/postinst deb/DEBIAN/postinst
          install -m 644 packaging/deb/workspaceos.service deb/usr/lib/systemd/user/workspaceos.service
          install -m 644 packaging/deb/workspaceos-daemon.desktop deb/etc/xdg/autostart/workspaceos-daemon.desktop

          # Native, self-contained single-file daemon (no .NET runtime needed).
          install -m 755 publish-linux/workspaceos deb/usr/bin/workspaceos

          # Menu entry so the tool is discoverable from the application menu.
          cat > deb/usr/share/applications/workspaceos.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=WorkspaceOS
          Comment=Hyprland-inspired workspaces, tiling and hotkeys (native)
          Exec=workspaceos retile
          TryExec=workspaceos
          Icon=preferences-desktop
          Terminal=false
          Categories=Utility;System;
          Keywords=workspace;tiling;wm;hotkeys;
          EOF

          {
            echo "WorkspaceOS ${VERSION} — NATIVE Linux build (no Wine)."
            echo
            echo "The daemon registers your keymap automatically on install and at"
            echo "every start: Cinnamon custom keybindings (Linux Mint), MATE"
            echo "run-commands, or an xbindkeys fallback elsewhere."
            echo
            echo "CLI:"
            echo "  workspaceos status    - daemon reachable? tiling on/off"
            echo "  workspaceos keys      - show the active keymap"
            echo "  workspaceos retile    - force a re-tile of the current workspace"
            echo "  workspaceos action CloseWindow"
            echo
            echo "Config: ~/.config/WorkspaceOS/config.json (same format as Windows)."
            echo "Default keymap: Win+1..9 workspaces, Win+Shift+1..9 send window,"
            echo "Win+H/J/K/L focus, Win+Shift+H/J/K/L move, Win+Ctrl+H/J/K/L resize,"
            echo "Win+Shift+Space float, Win+P togglesplit, Win+Shift+T tiling on/off,"
            echo "Win+W close, Win+M maximize, Win+C center, Win+F fullscreen."
          } > deb/usr/share/doc/workspaceos/README.Debian

          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          dpkg-deb --build --root-owner-group deb "workspaceos_${VERSION}_amd64.deb"

          dpkg-deb --info "workspaceos_${VERSION}_amd64.deb"
          dpkg-deb --contents "workspaceos_${VERSION}_amd64.deb"

      - name: Verify deb payload
        run: |
          set -e
          DEB=$(ls workspaceos_*_amd64.deb)
          TMP=$(mktemp -d)
          dpkg-deb -R "$DEB" "$TMP"
          test -x "$TMP/usr/bin/workspaceos"
          test -f "$TMP/usr/lib/systemd/user/workspaceos.service"
          test -f "$TMP/etc/xdg/autostart/workspaceos-daemon.desktop"
          test -f "$TMP/usr/share/applications/workspaceos.desktop"
          "$TMP/usr/bin/workspaceos" --help 2>/dev/null || [ $? -eq 2 ]
          echo "deb payload verified: $DEB"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-release
          path: workspaceos_*_amd64.deb

  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-deb]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-release/WorkspaceOS.exe
            artifacts/windows-release/WorkspaceOS-Setup.exe
            artifacts/windows-release/WorkspaceOS-*-portable.zip
            artifacts/deb-release/workspaceos_*_amd64.deb
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
